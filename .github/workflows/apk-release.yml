name: APK Production Release

# Publishes a full GitHub Release carrying the phone and TV APKs, which is how
# BitChord is distributed -- it is sideloaded, there is no store.
#
# android.yml already builds a signed prod APK on every push to main, but it
# only uploads CI artifacts: nothing a user can install, and nothing the in-app
# updater can see. This is the workflow that actually publishes.
#
# The tag is the version: `v1.8.1` releases 1.8.1. AppUpdateChecker compares the
# release's tag against the build's own VERSION_NAME, so the two have to agree.
# The guard below refuses to publish when they don't, rather than cutting a
# release no installed build will ever be offered.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64     base64 of the release .jks
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias inside that keystore
#   KEY_PASSWORD        key password
#   LASTFM_API_KEY      baked into BuildConfig
#   LASTFM_SECRET
#   SUPABASE_URL        the campaign read path; blank disables injection
#   SUPABASE_ANON_KEY
#
# The keystore MUST be the one existing releases are signed with. Android
# refuses to install an update signed by a different key, so a fresh key here
# would force every current user to uninstall and lose their library.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (must match build.gradle.kts)"
        required: true

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # A tag that disagrees with the stamped version, or a leftover beta
      # marker, is the exact way a release ships that nobody is offered. Both
      # are cheap to check and impossible to notice afterwards.
      - name: Refuse to publish an unstamped or beta build
        run: |
          version="${{ steps.version.outputs.value }}"
          stamped=$(grep -oP 'extra\["bitchordVersionName"\]\s*=\s*"\K[^"]+' build.gradle.kts)
          beta=$(grep -oP 'extra\["bitchordBetaSuffix"\]\s*=\s*"\K[^"]*' build.gradle.kts)

          if [ "$stamped" != "$version" ]; then
            echo "::error::build.gradle.kts stamps \"$stamped\" but the release says \"$version\". Bump bitchordVersionName and bitchordVersionCode first."
            exit 1
          fi

          if [ -n "$beta" ]; then
            echo "::error::bitchordBetaSuffix is \"$beta\". Blank it before a real release, or every tester keeps being treated as newer than this one and never sees the update prompt."
            exit 1
          fi

          echo "Stamped version $stamped, no beta marker -- good to release."

      - name: Check the signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Without them the APKs come out unsigned and cannot be installed as an update."
            exit 1
          fi
          echo "Signing secrets present."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          } > local.properties

      - name: Decode the release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # :app:assembleProdRelease pulls in the watch APK too -- BundleWearApk
      # generates it into the phone APK's assets, so the watch app rides inside
      # the phone one rather than shipping as a separate asset.
      - name: Build the signed prod APKs
        run: ./gradlew :app:assembleProdRelease :tv:assembleProdRelease --stacktrace

      - name: Collect and name the release assets
        id: collect
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist

          # The updater takes a release's APKs by name: "BitChord-" for the
          # phone, "BitChordTV-" for the TV, and the universal build (no _ABI
          # suffix) first, as it installs anywhere. See AppUpdateChecker.
          collect() {
            src_dir="$1"; prefix="$2"
            for file in "$src_dir"/*.apk; do
              base=$(basename "$file")
              case "$base" in
                *universal*) suffix="" ;;
                *arm64-v8a*) suffix="_arm64-v8a" ;;
                *armeabi-v7a*) suffix="_armeabi-v7a" ;;
                *x86_64*) suffix="_x86_64" ;;
                *) suffix="" ;;
              esac
              cp "$file" "dist/${prefix}-v${version}${suffix}.apk"
            done
          }

          collect app/build/outputs/apk/prod/release "BitChord"
          collect tv/build/outputs/apk/prod/release "BitChordTV"

          # A build that quietly fell back to unsigned is worse than no build:
          # it installs for nobody and breaks the update path for everyone.
          if ls dist/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::An unsigned APK was produced -- the keystore did not take. Refusing to publish."
            exit 1
          fi

          (cd dist && sha256sum *.apk > checksums.txt)
          ls -lh dist

      - name: Verify every APK is actually signed
        run: |
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Upload the release assets as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-apk-release-${{ steps.version.outputs.value }}
          path: dist/*

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: BitChord v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          # Published, not a draft, and not a prerelease: the updater reads
          # /releases/latest, which skips both.
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
